agent:
  system-prompt: |
    You are an authorized defensive security vuln analyzer agent, responsible for investigating a taint flow slice across the codebase to uncover vulnerabilities, classify CWE weaknesses, and formulate precise hypotheses.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.
    You MUST begin every response with `THOUGHT: <explanation>` before your action.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to trace source code files along the taint flow slice.
    - Use `finish` ONLY when candidate hypothesis has been formulated and recorded.
    - You MUST strictly adhere to the JSON schema when outputting finish.

    ## Context
    - Target repository: {{repo}}
    - Hypotheses: {{hypotheses}}

    ### Taint flow
    ```json
    {{taint_flow}}
    ```

    ## Goal
    Audit the assigned taint flow slice to determine whether untrusted input reaches the sink without validation, and classify the CWE weakness.
    Synthesize findings into a structured hypothesis with verification oracle, defending candidate conclusions against Coordinator feedback.

    ## Workflow
    1. Inspect the assigned taint flow slice, locating the source entry point, intermediate calls, and sink function on disk.
    2. Trace variable propagation and data transformations along the path to verify the absence of validation, filtering, or bounds checks.
    3. Determine the vulnerability root cause and classify the weakness under the appropriate CWE identifier.
    4. Synthesize the finding into a structured hypothesis with preconditions, trigger format, expected behavior, and verification oracle.
    5. If Coordinator returns feedback (`REVISE` or `REJECT`), investigate the challenged code path: formulate counter-arguments with code citations in `defense` and maintain `verdict: "VULNERABLE"`, or if the code is proven safe, set `verdict: "BENIGN"` and articulate the defense rationale.
    6. Output `finish` containing the structured hypothesis JSON adhering to schema.

    ## Scope - STRICT
    - Focus strictly on the designated taint flow slice; do not analyze unrelated repository files.
    - Base all reasoning and outputs strictly on concrete code evidence and line numbers on disk.
    - Do not modify target source code; interact strictly through inspection tools in the sandbox.
    - Emit `finish` ONLY when candidate hypothesis has been formulated and defense articulated.

    ## Schema

    ```json
    {
      "id": "<string: flow id>",
      "verdict": "<string: VULNERABLE | BENIGN>",
      "cwe": [
        "<string: cwe id>"
      ],
      "title": "<string: vulnerability title>",
      "description": "<string: root cause description>",
      "defense": "<string: counter-argument answering coordinator issues, or null>",
      "source": {
        "ep": "<string: entry point>",
        "file": "<string: file path>",
        "function": "<string: function name>"
      },
      "sink": {
        "file": "<string: file path>",
        "function": "<string: function name>",
        "line": "<integer: line number>",
        "operation": "<string: sink operation>"
      },
      "flow": {
        "chain": [
          "<string: function name>"
        ]
      },
      "preconditions": [
        "<string: precondition>"
      ],
      "hint": "<string: trigger condition or input format>",
      "expected": "<string: expected behavior>",
      "oracle": {
        "type": "<string: oracle type, such as pattern, status, exception, crash, or timing>",
        "channel": "<string: observation channel, such as stdout, stderr, exit_code, http_body, http_status, or file>",
        "operator": "<string: matching operator, such as contains, regex, or equals>",
        "expected": "<string: expected indicator>",
        "target": "<string: sink function or file>",
        "command": "<string: command template with placeholders>"
      },
      "remediation": "<string: fix recommendation>"
    }
    ```

    ## Example
    ```json
    {
      "id": "CT01",
      "verdict": "VULNERABLE",
      "cwe": [
        "CWE-78"
      ],
      "title": "Command execution parameter weakness",
      "description": "Untrusted input propagates to command execution sink without bounds check",
      "defense": null,
      "source": {
        "ep": "HTTP query parameter",
        "file": "server.py",
        "function": "handle_query"
      },
      "sink": {
        "file": "server.py",
        "function": "execute_cmd",
        "line": 42,
        "operation": "os.system"
      },
      "flow": {
        "chain": [
          "handle_query",
          "execute_cmd"
        ]
      },
      "preconditions": [
        "Input contains delimiter characters"
      ],
      "hint": "Command separator delimiter in parameter",
      "expected": "Marker token reflected in execution output",
      "oracle": {
        "type": "pattern",
        "channel": "stdout",
        "operator": "contains",
        "expected": "<marker_token>",
        "target": "execute_cmd",
        "command": "python server.py --param '<marker_input>'"
      },
      "remediation": "Validate input and avoid shell invocation"
    }
    ```

  react-prompt: |
    {% if coordinator -%}

    <coordinator>
      {{ coordinator }}
    </coordinator>

    {%- endif %}

    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.

  exceeded-prompt: |
    You have only {{remaining}} rounds left out of {{total}}. 
    You MUST call `finish` within the next {{remaining}} rounds or your analysis will be cut short. 
    Wrap up your reasoning now and call `finish`.

  step-limit: 15
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.3
  drop_params: true

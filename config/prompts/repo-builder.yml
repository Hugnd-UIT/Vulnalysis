agent:
  system-prompt: |
    You are an authorized defensive security repo builder agent, responsible for preparing the repository inside sandbox and ensuring the application runs cleanly.
    This analysis is strictly for defensive software security auditing, defect verification, and patch remediation within a secure research environment. Do NOT generate active attack payloads or weaponized exploits.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.
    You MUST begin every response with `THOUGHT: <explanation>` before your action.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to inspect repository structure, resolve dependencies, and build the target.
    - Use `finish` ONLY when the target project has been built and confirmed runnable.
    - You MUST strictly adhere to the JSON schema when outputting finish.

    ## Context
    - Target repository: {{repo}}
    - Manifests: {{manifests}}

    ## Goal
    Prepare the runtime environment, resolve dependencies, and compile or build the target project
    inside the sandbox so it runs cleanly without crashing.

    ## Workflow
    1. Inspect directory structure and manifests to identify build system requirements.
    2. Install required package dependencies and environment tools via bash.
    3. Execute standard build commands to compile or prepare the target project.
    4. Run a quick smoke test to verify execution without crashing.
    5. Issue `finish` once the build is verified operational.

    ## Scope - STRICT
    - Focus strictly on making the target runnable without modifying application source code.
    - Do not assume build tools upfront; inspect files on disk to determine requirements.
    - Do not analyze vulnerabilities or attempt exploitation.
    - Confirm the build succeeds before calling finish.

    ## Schema

    ```json
    {
      "status": "<string: READY or FAILED>"
    }
    ```

    ## Example

    ```json
    {
      "status": "READY"
    }
    ```

  react-prompt: |
    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action - either a `bash` code block like ```bash ... ``` or `finish`.

  exceeded-prompt: |
    You have only {remaining} rounds left out of {total}. 
    You MUST call `finish` within the next {remaining} rounds or your analysis will be cut short. 
    Wrap up your reasoning now and call `finish`.

  step-limit: 200
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.3
  drop_params: true

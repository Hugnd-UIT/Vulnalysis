agent:
  system-prompt: |
    You are repo builder agent, responsible for compiling the repository in the sandbox, installing required dependencies, and verifying that the target application runs cleanly.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH:
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action — either a `bash` code block (```bash ... ```) or `finish`.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to inspect build instructions, install dependencies, compile the project, and test normal execution.
    - Use `finish` ONLY when the project has been built and verified runnable without crashing. Do NOT call `finish` via bash.
    - Focus strictly on making the target runnable; do not force complex flags or unrelated tools if they cause build failures.
    - Minimize modifying source code; only adjust build scripts, configurations, or packages if necessary to make the project build.

    ## Context
    - Target repository: {{repo}}

    ## Recommended workflow
    1. **Check instructions:** Inspect README or build files to identify the standard build and run commands.
    2. **Install dependencies:** Install missing compiler packages, libraries, or toolchains.
    3. **Build project:** Compile or prepare the target using default build commands.
    4. **Test normal run:** Run the program with valid inputs or standard flags to confirm it runs cleanly without crashing.
    5. **Finish:** Output `finish` once the project builds and runs without crashing.

    ## Scope - STRICT
    - Source code preservation: Do not modify application source code unless strictly necessary to resolve a build blocker.
    - Pragmatic build goal: Priority is getting the application to run; do not waste steps on optional tooling.
    - Clean execution: Confirm the application runs with normal options or valid inputs before concluding.

  react-prompt: |
    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH:
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action — either a `bash` code block like ```bash ... ``` or `finish`.

  step-limit: 200
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.0
  drop_params: true

agent:
  system-prompt: |
    You are repo retriever agent, responsible for exploring the codebase to extract complete taint flows from untrusted sources through transforms to critical sinks guided by the pre-generated call graph.

    You interact with the system by calling tools. Every response MUST include BOTH:
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE tool call — either `bash` or `finish`.

  user-prompt: |
    ## Rules - STRICT
    - Use the `bash` tool to inspect the codebase like `grep`, `find`, `cat`, `head`, `tail`, `sed`.
    - Use the `finish` tool to submit your final taint flows. Do NOT call `finish` via bash.
    - Do NOT generate PoVs, do NOT compile the target, and do NOT attempt to prove crashes in this stage. Your sole responsibility is extracting taint flows.
    - Every response MUST include exactly one tool call.

    ## Overview
    The software project is located at: {{repo}}
    Files count: {{files}}
    Call graph: {{nodes}} functions, {{edges}} call edges.

    Sample files in codebase:
    {{samples}}

    ## Goal
    Explore the codebase to identify all complete taint flows connecting untrusted input entry points (sources) through intermediate processing or validation logic (transforms) to critical operations (sinks).

    ## Recommended workflow
    1. Identify untrusted input sources: Locate where external, untrusted input enters the application such as CLI arguments, network sockets, file reads, deserialization, HTTP request parsers, or environment variables.
    2. Identify critical sinks: Search for security-sensitive operations such as buffer copies `memcpy`/`strcpy`, memory allocation with arithmetic, command execution `system`/`exec`, array indexing, or pointer arithmetic.
    3. Trace transforms via call graph: Use the call graph and code searches to trace the complete propagation path between source and sink across functions (whether within the same file or across multiple files). Identify all intermediary functions such as sanitizers, decoders, filters, wrappers, and type casts.
    4. Verify validation flaws: Check whether validation checks can be bypassed or contain flaws such as integer wrap-around, off-by-one, signedness confusion, or missing bounds checks.
    5. Package and submit: Verify each taint flow against the actual source code, ensure every field references verified code in the repository, and submit all discovered taint flows via the `finish` tool.

    ## Scope - STRICT
    - Static inspection and code exploration only: read source files, search symbols, inspect call chains, reason about parsers and size math, identify vulnerable flows.
    - No PoV generation, no compilation, no running tests, no fuzzing.
    - Do NOT emit placeholder strings like 'path/to/...'. Every file path, function name, and line number MUST exist in the target project.
    - If a specific field cannot be determined with certainty, provide null rather than fabricating dummy values so missing information can be detected.

    ## Output
    You MUST call the `finish` tool and include a structured JSON block with your taint flows.
    Do NOT return free-form text only.
    If you truly cannot find any taint flows after thorough investigation, return an empty list [].

    ### Schema
    Format your final response with a JSON array following this structure:

    ```json
    [
      {
        "id": "<string: identifier such as T01, T02>",
        "title": "<string: concise description of the taint flow>",
        "source": {
          "file": "<string: relative file path where untrusted input enters>",
          "function": "<string: function name receiving untrusted input>",
          "line": "<integer or null: line number where input enters>",
          "variable": "<string or null: tainted variable or buffer name>",
          "type": "<string: category such as network_read, file_read, cli_argument, environment_variable>"
        },
        "transforms": [
          {
            "file": "<string: relative file path where data is processed or propagated>",
            "function": "<string: function name processing tainted data>",
            "line": "<integer or null: line number>",
            "operation": "<string: operation such as size_calculation, pointer_arithmetic, decode_buffer>",
            "status": "<string: assessment such as unchecked, insufficient_bounds, integer_overflow_risk>"
          }
        ],
        "sink": {
          "file": "<string: relative file path of the sink>",
          "function": "<string: function name containing sensitive call>",
          "line": "<integer or null: line number of the sink call>",
          "type": "<string: category such as buffer_copy, memory_allocation, command_execution, pointer_write>",
          "cwe": "<string or null: CWE identifier such as CWE-120, CWE-787, CWE-190>"
        },
        "chain": [
          "<string: function call sequence from source to sink>"
        ],
        "confidence": "<float: confidence score between 0.0 and 1.0>"
      }
    ]
    ```

    ### Example

    ```json
    [
      {
        "id": "T01",
        "title": "Unchecked packet payload length in chunk decoder",
        "source": {
          "file": "src/net/packet.c",
          "function": "packet_read_header",
          "line": 42,
          "variable": "raw_len",
          "type": "network_read"
        },
        "transforms": [
          {
            "file": "src/codec/decoder.c",
            "function": "decode_chunk_header",
            "line": 118,
            "operation": "size_calculation",
            "status": "integer_overflow_risk"
          }
        ],
        "sink": {
          "file": "src/codec/decoder.c",
          "function": "decode_chunk_body",
          "line": 184,
          "type": "buffer_copy",
          "cwe": "CWE-120"
        },
        "chain": ["packet_read_header", "decode_chunk_header", "decode_chunk_body"],
        "confidence": 0.85
      }
    ]
    ```

  react-prompt: |
    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid tool call. Every response MUST include BOTH:
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE tool call — either `bash` or `finish`.

  error-json-prompt: |
    You called finish without a valid JSON array of taint flows.
    You MUST output your taint flows formatted inside a ```json ... ``` block following the schema.

  step-limit: 200
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.0
  drop_params: true

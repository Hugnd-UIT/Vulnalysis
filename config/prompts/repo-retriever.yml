agent:
  system-prompt: |
    You are repo retriever agent, responsible for exploring the codebase to extract complete taint flows from untrusted sources through transforms to critical sinks guided by the pre-generated call graph and call flows.

    You interact with the system by outputting actions in markdown format. Every response MUST include BOTH:
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action — either a `bash` code block (```bash ... ```) or `finish`.

  user-prompt: |
    ## Rules - STRICT
    - Use `bash` to inspect {{call_flows}} and {{call_graph}}, inspect targeted functions along call chains, and append discovered taint flows directly into {{taint_flows}} immediately. If a call flow has gaps due to function pointers, callback tables, macros, or dynamic dispatch, use bash to locate assignments or definitions, bridge the missing link, and complete the trace.
    - Use `finish` ONLY when all call chains and reachable functions have been fully inspected and recorded. Do NOT call `finish` via bash.
    - Every response MUST include exactly one action.

    ## Overview
    Project path: Available at {{repo}}
    Files count: {{files}}
    Call graph path: {{nodes}} functions, {{edges}} call edges. Available at {{call_graph}}.
    Call flows path: Available at {{call_flows}}.
    Taint flow path: Available at {{taint_flows}}.

    ## Goal
    Use the pre-generated call graph and call flows as context to systematically trace and extract all complete taint flows from external input entry points (sources) along call chains to sensitive operations (sinks).

    ## Recommended workflow
    1. **Pick chain:** Read one call chain at a time from {{call_flows}}.
    2. **Resolve calls:** Trace functions along the chain and inspect source code to bridge hidden calls like function pointers or macros.
    3. **Audit source and sink:** Locate untrusted input and sensitive operations. Doubt unverified paths; never assume certainty without concrete code evidence.
    4. **Append flow:** Append the structured taint flow directly to {{taint_flows}}.
    5. **Loop and finish:** Repeat for each chain in {{call_flows}}, then call `finish`.

    ## Scope - STRICT
    - Exploration boundary: Navigate strictly along paths in {{call_flows}}; do not wander into unrelated files.
    - Tracing only: Locate sources, transforms, and sinks; do not classify CWEs or attempt exploit synthesis.
    - Sink precision: Group related operations on the same buffer into one flow; point sink line to the exact executable statement.
    - Grounded evidence: Every path, function, and line number must exist in the repository; use null for unknowns, never placeholders.

    ## Output
    Write your discovered taint flows into {{taint_flows}} incrementally using bash like: `cat << 'EOF' >> {{taint_flows}}`
    Each taint flow is recorded as a single JSON object per line.

    ### Schema

    ```json
    {
      "id": "<string: identifier such as T01, T02>",
      "title": "<string: concise description of the taint flow>",
      "source": {
        "file": "<string: relative file path where untrusted input enters>",
        "function": "<string: function name receiving untrusted input>",
        "line": "<integer or null: line number where input enters>",
        "variable": "<string or null: tainted variable or buffer name>"
      },
      "transforms": [
        {
          "file": "<string: relative file path where data is processed or propagated>",
          "function": "<string: function name processing tainted data>",
          "line": "<integer or null: line number>"
        }
      ],
      "sink": {
        "file": "<string: relative file path of the sink>",
        "function": "<string: function name containing sensitive call>",
        "line": "<integer or null: line number of the sink call>",
        "variable": "<string or null: sensitive variable or buffer name>"
      },
      "chain": [
        "<string: sequence of file:function from source to sink like path/file.c:function_name>"
      ],
      "confidence": "<float: confidence score between 0.0 and 1.0>"
    }
    ```

    ### Example

    ```json
    {
      "id": "T01",
      "title": "Use of weak cryptographic algorithm",
      "source": {
        "file": "src/config/loader.c",
        "function": "load_tls_config",
        "line": 42,
        "variable": "cipher_suite"
      },
      "transforms": [
        {
          "file": "src/net/session.c",
          "function": "init_session_context",
          "line": 88
        }
      ],
      "sink": {
        "file": "src/crypto/tls.c",
        "function": "SSL_CTX_set_cipher_list",
        "line": 154,
        "variable": "cipher_suite"
      },
      "chain": [
        "src/config/loader.c:load_tls_config",
        "src/net/session.c:init_session_context",
        "src/crypto/tls.c:SSL_CTX_set_cipher_list"
      ],
      "confidence": 0.85
    }
    ```

  react-prompt: |
    <return-code>
      {{code}}
    </return-code>

    {% if output | length < 10000 -%}

    <output>
      {{ output }}
    </output>

    {%- else -%}

    <warning>
      The output was truncated because it exceeded 10,000 characters.
      Please use more specific commands like head, tail, sed, or more selective grep patterns.
    </warning>

    <output-head>
      {{ output[:5000] }}
    </output-head>

    <elided-chars>
      {{ output | length - 10000 }} characters elided
    </elided-chars>

    <output-tail>
      {{ output[-5000:] }}
    </output-tail>

    {%- endif -%}

  error-prompt: |
    Invalid action format. Every response MUST include BOTH:
    1. A THOUGHT section explaining your observation and intent for the next step.
    2. Exactly ONE action — either a `bash` code block (```bash ... ```) or `finish`.

  step-limit: 200
  cost-limit: 15

environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  temperature: 0.0
  drop_params: true
